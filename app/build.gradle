plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.tangodl"
    compileSdk 34
    defaultConfig {
        applicationId "com.tangodl"
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName "1.14"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    // ملفات غير مضغوطة داخل الـAPK ليضغطها 7z بكفاءة أكبر
    packagingOptions {
        dex { useLegacyPackaging false }
        jniLibs { useLegacyPackaging false }
    }
    androidResources {
        noCompress 'xml', 'png', 'jpg', 'jpeg', 'webp', 'gif', 'json', 'txt', 'html', 'js', 'css', 'ttf', 'otf', 'properties', 'bin', 'dat', 'version', 'kotlin_module'
    }
}
dependencies {
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
